name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建后台
        run: pnpm build:admin

      - name: 构建前台
        run: pnpm build:site

      - name: 服务端类型检查
        run: pnpm --filter @gleanlight/server exec tsc --noEmit
