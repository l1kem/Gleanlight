# Gleanlight · 拾光集 —— 自托管知识库 + 博客
#
#   docker compose up -d --build
#
#   前台          http://<host>:4321  （发布后的静态站）
#   后台          http://<host>:7300
#   数据/备份     ./docker-data  （SQLite + 附件，拷走即迁移）
#   发布产物      ./public-dist  （纯静态，也可直接交给 Nginx/CDN 托管）
#   初始账号      首次启动自动创建；随机密码见 `docker compose logs`
#                 也可在下方 environment 预设 ADMIN_USER / ADMIN_PASSWORD

services:
  gleanlight:
    build: .
    image: gleanlight:latest
    container_name: gleanlight
    restart: unless-stopped
    ports:
      - "127.0.0.1:7300:7300" # 后台默认仅宿主机可访问；经 VPN/反代开放时再显式修改
      - "4321:7301"   # 前台静态站（可对外）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7300/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BLOG_HOST: 0.0.0.0
      BLOG_PORT: "7300"
      BLOG_FRONT_PORT: "7301"
      BLOG_DATA_DIR: /data
      BLOG_BACKUP_KEEP: "10"
      # BLOG_SITE_URL: https://your-domain.example   # RSS / sitemap 绝对地址
      # ADMIN_USER: admin
      # ADMIN_PASSWORD: change-me
    volumes:
      - ./docker-data:/data
      - ./public-dist:/app/public-dist
